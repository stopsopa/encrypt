# Builds the three implementations, runs every test suite (unit tests, the cross matrix
# including the browser through Playwright, vectors, rekey, diff stability, negative tests)
# and every usage example on Linux and macOS, and publishes one explorable report to
# GitHub Pages.
#
# The only workflow of this repository, one run per push:
#
#   every push, every PR   test -> build-matrix (the Rust ssenc binary for every released platform)
#                          test -> report
#   push to main           ... and then: deploy    (GitHub Pages: the report and the encryptor page)
#   push of a tag          ... and then: release   (GitHub Release, what "ssenc --update" downloads)
#
# Nothing is released when tests fail. A tag is created and pushed with tag.sh (xx publish).
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run of the older one.
# Tags are never cancelled: each one is a release.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      SSENC_OS_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Same Node.js version as local development: both read .tool-versions (asdf).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock') }}

      # The Bash implementation needs bash >= 4 and an openssl CLI with Argon2id (>= 3.2).
      # macOS ships bash 3.2 and LibreSSL; Ubuntu LTS ships OpenSSL 3.0. Homebrew has
      # current versions for both (it is preinstalled on the GitHub runners).
      - name: bash and openssl (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash openssl@3
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: openssl (Linux)
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xxd shellcheck openssh-client

      - name: install
        run: ./install.sh

      - name: compile
        run: ./compile.sh

      - name: envverify
        run: ./envverify.sh

      - name: committed typescript/dist is up to date
        run: git diff --exit-code -- typescript/dist

      - name: test
        run: ./test.sh

      # Every usage example in examples/ (command line and library, three variants each).
      # They assert their own results, so a broken example fails the build.
      - name: examples
        run: ./examples/examples.sh

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            tests/out/meta.json
            tests/out/checks.json
            tests/out/results.jsonl
            tests/out/artifacts/

  report:
    name: build report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
      - name: build the report (one page, all operating systems)
        run: |
          args=()
          for os in ubuntu-latest macos-latest; do
            mkdir -p "results/results-$os"   # a job that produced nothing shows up as a broken run
            args+=(--input "results/results-$os")
          done
          node --disable-warning=ExperimentalWarning tests/report/build.ts "${args[@]}" --output site
      - name: add the encryptor page (uses the browser build of the library)
        run: |
          mkdir -p site/encryptor site/typescript/dist
          cp encryptor/* site/encryptor/
          cp typescript/dist/ssenc.browser.js site/typescript/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: site
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  # The page always shows the true state of main, also when tests failed
  # (the workflow run itself still ends red because of the test job).
  deploy:
    name: publish to GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The Rust ssenc binary for every released platform. Built on every push (so a broken build is
  # seen before a release), published only for a tag (job release).
  build-matrix:
    name: build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        # artifact_name: the same names rust/src/update.rs looks for (fn asset)
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: ssenc-darwin-arm64
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ssenc-linux-x64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ssenc-linux-arm64
            use_cross: true
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # compiled crates of the previous run: the build is the slow part of this job
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      # a prebuilt binary: "cargo install cross" compiles it for minutes
      - name: install cross (if required)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # The version is embedded only when a tag is built (rust/build.rs reads SSENC_VERSION).
      # Everything else is "dev", and a "dev" binary refuses to --update.
      - name: build binary
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export SSENC_VERSION="${{ github.ref_name }}"
          fi
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            # SSENC_VERSION reaches the container thanks to rust/Cross.toml
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ssenc dist/${{ matrix.artifact_name }}

      # the binary of this runner is started: it has to report the version it was built for
      - name: check the version of the binary
        if: "!matrix.use_cross"
        run: |
          EXPECTED="ssenc rust dev"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            EXPECTED="ssenc rust ${{ github.ref_name }}"
          fi
          GOT="$(dist/${{ matrix.artifact_name }} --version)"
          echo "${GOT}"
          if [ "${GOT}" != "${EXPECTED}" ]; then
            echo "error: expected >${EXPECTED}<, got >${GOT}<"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: rust/dist/${{ matrix.artifact_name }}

  release:
    name: publish release
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # needed for changelog.md and scripts/release_notes.sh
      - uses: actions/checkout@v4

      # only the binaries (the same run also has the artifacts results-* and report)
      - uses: actions/download-artifact@v4
        with:
          pattern: ssenc-*
          path: release-artifacts

      # bare binaries + SHA256SUMS.txt: the shape "ssenc --update" expects from every release
      - name: prepare release files and checksums
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \;
          cd release-dist
          shasum -a 256 ssenc-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          /bin/bash scripts/release_notes.sh "${{ github.ref_name }}" "${{ github.repository }}" release-dist > release_notes.md
          cat release_notes.md

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          body_path: release_notes.md
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
